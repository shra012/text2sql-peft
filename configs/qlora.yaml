method: qlora
run_name: qlora
model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct
train_file: data/processed/train.jsonl
attn_implementation: sdpa
gradient_checkpointing: true
# base in 4-bit NF4 + double quant, bf16 compute
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  seed: 42
  epochs: 1
  per_device_batch_size: 1
  grad_accum: 16                # effective batch 16
  max_seq_len: 2560             # prompt (<=2048) + completion; longer rows are skipped
  drop_fit_levels: [truncated]  # skip rows whose schema had to be truncated
  max_prompt_tokens: 2048       # skip rows with longer prompts
  train_limit: 2000             # fixed subset (seed 42) shared by every method -> 125 steps
  max_steps: null               # optional cap (schedule compressed), e.g. 60 for LR sweeps
  warmup_ratio: 0.05            # cosine schedule
  max_grad_norm: 1.0
  weight_decay: 0.0
  optimizer: adamw
  lr: 2.0e-4
  save_steps: 0                 # 0 = only save final
