[project]
name = "t2s"
version = "0.1.0"
description = "Text-to-SQL fine-tuning experiments on BIRD: Full FT, LoRA, LoRA-FA, QLoRA, TinyLoRA"
requires-python = ">=3.11,<3.13"
dependencies = [
  "vllm==0.10.2",
  "transformers>=4.56,<4.57",
  "peft>=0.17",
  "trl==0.23.0",
  "bitsandbytes>=0.47",
  "datasets>=3.0",
  "accelerate>=1.10",
  "func-timeout>=4.3.5",
  "matplotlib>=3.9",
  "pyyaml",
  "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2s"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["wsp/notebook"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E731"]
